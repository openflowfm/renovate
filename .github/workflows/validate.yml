name: Validate config

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Keep in step with RENOVATE_VERSION in renovate.yml.
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: 44.149.2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate self-hosted runner config
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict config.js
      - name: Validate shared preset and this repo's config
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict --no-global default.json renovate.json
